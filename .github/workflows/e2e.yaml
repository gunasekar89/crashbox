name: e2e
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: helm/kind-action@v1
        with: {cluster_name: crashbox}
      - run: hack/e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundles
          path: e2e-bundles/
